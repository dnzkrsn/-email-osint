<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Email OSINT Pro</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#07090d;color:#f5f7fa}
main{max-width:1050px;margin:auto;padding:42px 18px}.hero{padding:10px 0 28px}h1{font-size:clamp(38px,8vw,64px);margin:0 0 8px}.sub{color:#9aa3b1;font-size:17px}
form{display:flex;gap:10px;margin-top:26px}input{flex:1;min-width:0;padding:17px;border:1px solid #303641;border-radius:14px;background:#10141b;color:white;font-size:17px}
button{padding:17px 24px;border:0;border-radius:14px;background:#fff;color:#0b0d11;font-weight:800;cursor:pointer}.card{margin-top:16px;padding:20px;border:1px solid #282e38;border-radius:18px;backgro[...]
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.label{color:#87919f;font-size:12px;text-transform:uppercase;letter-spacing:.1em}.value{margin-top:6px;font-size[...]
.ok{color:#78e08f}.bad{color:#ff7676}.muted{color:#8993a2}.pill{display:inline-block;padding:7px 11px;border:1px solid #343b47;border-radius:999px;margin:5px 5px 0 0}.links a{color:#c8d0ff;text-decora[...]
details{margin-top:16px}summary{cursor:pointer;font-weight:700}pre{white-space:pre-wrap;word-break:break-word;color:#cbd3df;font-size:12px}
.score{font-size:42px;font-weight:900}.bar{height:8px;background:#262c35;border-radius:99px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;width:var(--w)}
@media(max-width:600px){form{flex-direction:column}button{width:100%}}
</style></head>
<body><main>
<section class="hero"><h1>🔎 Email OSINT Pro</h1><div class="sub">Public-source intelligence for email addresses — no passwords or private-account access.</div>
<form id="form"><input id="email" type="email" placeholder="person@example.com" required><button>Run full check</button></form></section>
<div id="output"></div>
</main>
<script>
const form=document.getElementById("form"),out=document.getElementById("output");
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const list=(a)=>a&&a.length?a.map(x=>`<span class="pill">${esc(typeof x==="string"?x:(x.host||JSON.stringify(x)))}</span>`).join(""):'<span class="muted">None found</span>';
form.addEventListener("submit",async e=>{e.preventDefault();out.innerHTML='<div class="card">Running public-source checks…</div>';
try{let r=await fetch("/api/check?email="+encodeURIComponent(document.getElementById("email").value.trim())),d=await r.json();if(!r.ok)throw Error(d.error||"Check failed");
let risk=d.risk,gh=d.github_public_search,rd=d.rdap,dom=d.domain,hints=d.name_hints;
let ghhtml=gh.users?.length?gh.users.map(u=>`<div class="value"><a href="${esc(u.profile)}" target="_blank" rel="noopener">${esc(u.login)}</a></div>`).join(""):'<span class="muted">No public GitHu[...]
let social=Object.entries(d.public_search_links.social_username||{}).map(([n,u])=>`<a class="pill" href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}</a>`).join("");
let searches=Object.entries(d.public_search_links).filter(([k,v])=>k!=="social_username"&&v).map(([k,v])=>`<a class="pill" href="${esc(v)}" target="_blank" rel="noopener">${esc(k.replaceAll("_"," "))}</a>`).join("");
out.innerHTML=`
<div class="card"><div class="grid">
<div><div class="label">Email</div><div class="value">${esc(d.email)}</div></div>
<div><div class="label">Syntax</div><div class="value ok">Valid</div></div>
<div><div class="label">Provider</div><div class="value">${esc(dom.provider)}</div></div>
<div><div class="label">Disposable</div><div class="value">${dom.disposable?'<span class="bad">Likely</span>':'<span class="ok">Not detected</span>'}</div></div>
<div><div class="label">DNS</div><div class="value">${dom.resolves?'<span class="ok">Resolves</span>':'<span class="bad">No resolution</span>'}</div></div>
<div><div class="label">Gravatar</div><div class="value">${d.gravatar.found?'<span class="ok">Found</span>':'Not found'}</div></div>
</div></div>
<div class="card"><div class="label">Risk / reputation signal</div><div class="score">${risk.score}/100 <span class="value">${esc(risk.label)}</span></div><div class="bar"><i style="--w:${risk.score}%"></i></div></div>
<div class="card"><div class="label">Possible identity / username hints</div>${hints.length?hints.map(x=>`<div class="value">${esc(x.first||"")} ${esc(x.last||x.username||"")}<div class="muted">Unverified</div></div>`).join(""):'<div class="value muted">None found</div>'}</div>
<div class="card"><div class="label">DNS security</div><div class="value">MX</div>${list(dom.mx)}<div class="value">SPF</div>${list(dom.spf)}<div class="value">DMARC</div>${list(dom.dmarc)}<div class="value">TLS</div>${list(dom.tls)}</div>
<div class="card"><div class="label">Domain registration (RDAP)</div><div class="grid"><div><div class="label">Registrar</div><div class="value">${rd.registrar?.length?esc(rd.registrar.join(", ")):"Unknown"}</div></div><div><div class="label">Registered</div><div class="value">${esc(rd.registered)}</div></div></div></div>
<div class="card"><div class="label">Public GitHub</div><div class="value">${esc(gh.total_count)} result(s)</div>${ghhtml}</div>
<div class="card links"><div class="label">Public search shortcuts</div><div class="value">${searches}</div><div class="label" style="margin-top:18px">Username searches</div><div class="value">${social}</div></div>
<div class="card">
  <div class="label">🤖 AI Intelligence</div>
  <div class="value muted">Analyze the collected public-source results with AI.</div>
  <button onclick="runAI()" id="aiButton" style="margin-top:14px;">🤖 Run AI Analysis</button>
  <div id="aiOutput" style="margin-top:16px;"></div>
</div>

<div class="card">
  <details>
    <summary>Raw JSON</summary>
    <pre>${esc(JSON.stringify(d,null,2))}</pre>
  </details>
</div>`;
}catch(err){out.innerHTML=`<div class="card bad">${esc(err.message)}</div>`}});
</script></body></html>
